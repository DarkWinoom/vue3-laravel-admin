name: Draft desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching package.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: windows
            bundles: nsis
          - os: macos-15
            name: macos
            bundles: app,dmg
          - os: ubuntu-24.04
            name: linux
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Validate release
        run: node scripts/release-check.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.DESKTOP_UPDATER_PUBLIC_KEY }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: pnpm check
      - run: pnpm test
      - run: pnpm api:check
      - run: pnpm check:desktop
      - name: Signed updater packages
        run: node scripts/desktop.mjs build --release --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.DESKTOP_UPDATER_PUBLIC_KEY }}
      - run: node scripts/collect-artifacts.mjs --signed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-${{ matrix.name }}
          path: .release-artifacts/
          include-hidden-files: true
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-*
          path: .release-artifacts
          merge-multiple: true
      - run: node scripts/release-manifest.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      - name: Create or update draft only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release.json 2>/dev/null; then
            node -e "if(!require('/tmp/release.json').isDraft) throw new Error('Published releases are immutable')"
            gh release upload "$RELEASE_TAG" .release-artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" .release-artifacts/* --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file .release-artifacts/release-notes.md
          fi
