name: Project toolchain
description: Install the pinned frontend and PHP toolchain
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 11.5.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.19.0
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          frontend/pnpm-lock.yaml
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: '8.4'
        extensions: pdo_mysql, pdo_sqlite, mbstring, intl, bcmath, zip, sodium, fileinfo
        coverage: none
        tools: composer:2
    - shell: bash
      run: |
        pnpm install --frozen-lockfile
        pnpm --dir frontend install --frozen-lockfile
        composer --working-dir=backend install --no-interaction --prefer-dist
        node scripts/setup.mjs
