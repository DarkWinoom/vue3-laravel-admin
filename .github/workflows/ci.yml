name: Quality and desktop
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      portability:
        description: Test an isolated derived application with basic releases
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      portability: ${{ inputs.portability == true }}
