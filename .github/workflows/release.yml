name: Draft desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching package.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      mode: ${{ steps.source.outputs.mode }}
      environment: ${{ steps.source.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - id: source
        run: node scripts/release-source.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  checks:
    needs: verify
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.verify.outputs.sha }}
  build:
    needs: [verify, checks]
    environment: ${{ needs.verify.outputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: windows
            bundles: nsis
          - os: macos-15
            name: macos
            bundles: app,dmg
          - os: ubuntu-24.04
            name: linux
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: ./.github/actions/setup
      - name: Validate release
        run: node scripts/release-check.mjs
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.DESKTOP_UPDATER_PUBLIC_KEY }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: frontend/src-tauri
          shared-key: desktop-${{ runner.os }}
          cache-on-failure: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Optional Windows system signing
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-signing.ps1
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
      - name: Build configured release packages
        run: node scripts/desktop.mjs build --release --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.DESKTOP_UPDATER_PUBLIC_KEY }}
      - name: Remove imported Windows certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-signing.ps1 -Cleanup
      - run: node scripts/collect-artifacts.mjs --release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.name }}
          path: .release-artifacts/
          include-hidden-files: true
          if-no-files-found: error
  draft:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: .release-artifacts
          merge-multiple: true
      - run: node scripts/release-manifest.mjs
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      - name: Create or update draft only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
          if gh release view "$RELEASE_TAG" --json isDraft,assets > /tmp/release.json 2>/dev/null; then
            node -e "const r=require('/tmp/release.json');if(!r.isDraft) throw new Error('Published releases are immutable');const stale=r.assets.filter(a=>!require('fs').existsSync('.release-artifacts/'+a.name));if(stale.length)throw new Error('Draft contains additional assets. Review them manually before retrying: '+stale.map(a=>a.name).join(', '))"
            gh release upload "$RELEASE_TAG" .release-artifacts/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file .release-artifacts/release-notes.md
          else
            gh release create "$RELEASE_TAG" .release-artifacts/* --draft --verify-tag --target "$SOURCE_SHA" --title "$RELEASE_TAG" --notes-file .release-artifacts/release-notes.md
          fi
